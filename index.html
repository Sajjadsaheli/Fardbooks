<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مینی‌اپ انتشارات فرهنگی فرد</title>
<style>
:root{--bg:#fff;--tx:#1c1c1e;--hint:#6d6d72;--btn:#2f7d5b;--btx:#fff;--card:#f2f4f3}
@media(prefers-color-scheme:dark){:root{--bg:#17181a;--tx:#f2f2f2;--hint:#9a9a9f;--card:#242628}}
*{box-sizing:border-box;margin:0}
body{font:15px/1.7 Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{padding:16px 16px 4px}header h1{font-size:18px}header small{color:var(--hint)}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;position:sticky;top:0;background:var(--bg);z-index:2}
nav button{white-space:nowrap;border:0;border-radius:18px;padding:6px 14px;background:var(--card);color:var(--tx);font:inherit}
nav button.on{background:var(--btn);color:var(--btx)}
main{padding:4px 16px 24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
.grid .card{margin:0;padding:8px;text-align:center}
.cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:#8883}
.t{font-weight:700}.h{color:var(--hint);font-size:13px}
.btn{display:inline-block;border:0;border-radius:10px;padding:8px 14px;background:var(--btn);color:var(--btx);font:inherit;margin:6px 0 0 6px}
.btn.alt{background:transparent;color:var(--btn);border:1px solid var(--btn)}
.bar{height:8px;background:#8883;border-radius:4px;margin:4px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--btn)}
textarea{width:100%;border-radius:10px;border:1px solid #8886;padding:8px;background:var(--bg);color:var(--tx);font:inherit}
details summary{font-weight:700;cursor:pointer}
.stars span{font-size:28px;color:#e3a008;cursor:pointer}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;display:none}
img.news{width:100%;border-radius:10px;margin-bottom:8px}
.config{background:#fff3;border:1px solid #fa0;border-radius:10px;padding:12px;margin-bottom:12px}
.config input{width:100%;padding:8px;margin:4px 0;border:1px solid #888;border-radius:6px}
.config button{margin-top:8px}
</style>
</head>
<body>
<header><h1 id="name">انتشارات فرهنگی فرد</h1><small id="sub">در حال بارگذاری...</small></header>
<div id="config" class="config" style="display:none">
  <p class="t">⚙️ تنظیمات API</p>
  <p class="h">آدرس سرور ربات</p>
  <input type="text" id="apiUrl" placeholder="http://46.4.144.76:8080">
  <button class="btn" onclick="saveConfig()">ذخیره</button>
</div>
<nav id="nav"></nav>
<main id="view"></main>
<div id="toast"></div>
<script>
// آدرس سرور ربات را اینجا تنظیم کنید
const DEFAULT_API_URL = 'http://46.4.144.76:8080';

let API_URL = localStorage.getItem('wiki_api_url') || DEFAULT_API_URL;
const hp = new URLSearchParams(location.hash.slice(1));
const INIT = hp.get('tgWebAppData') || '';

const post = (ev, data) => {
  try {
    if (window.TelegramWebviewProxy) TelegramWebviewProxy.postEvent(ev, JSON.stringify(data || {}));
    else if (parent !== window) parent.postMessage(JSON.stringify({eventType: ev, eventData: data || {}}), '*');
  } catch (e) {}
};
try { const th = JSON.parse(hp.get('tgWebAppThemeParams') || '{}'), s = document.documentElement.style;
  if (th.bg_color) { s.setProperty('--bg', th.bg_color); s.setProperty('--tx', th.text_color); s.setProperty('--hint', th.hint_color);
    s.setProperty('--btn', th.button_color); s.setProperty('--btx', th.button_text_color); s.setProperty('--card', th.secondary_bg_color || th.bg_color); } } catch (e) {}
post('web_app_ready'); post('web_app_expand');

const $ = s => document.querySelector(s), view = $('#view');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2200); };
const openLink = u => /^https?:\/\//.test(u) && (window.TelegramWebviewProxy || parent !== window ? post('web_app_open_link', {url: u}) : window.open(u, '_blank'));
let BOT = '';
const openBot = p => { post('web_app_open_tg_link', {path_full: `/${BOT}?start=${p}`}); if (!window.TelegramWebviewProxy && parent === window) window.open(`https://t.me/${BOT}?start=${p}`); };

async function api(path, body) {
  if (!API_URL) {
    $('#config').style.display = 'block';
    throw new Error('لطفاً آدرس API را تنظیم کنید');
  }
  const url = API_URL + path;
  const r = await fetch(url, {method: body ? 'POST' : 'GET', headers: {'X-Init-Data': INIT, 'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const d = await r.json(); if (!r.ok) throw new Error(d.error || 'خطا'); return d;
}

function saveConfig() {
  API_URL = $('#apiUrl').value.trim();
  if (API_URL) {
    localStorage.setItem('wiki_api_url', API_URL);
    $('#config').style.display = 'none';
    go(cur || 'books');
  }
}

const TABS = [['books','📚 کتاب‌ها'],['wiki','📖 ویکی'],['events','📅 رویدادها'],['contests','🏆 مسابقات'],['news','📰 اخبار'],['progress','📈 در حال تولید'],['club','🎁 باشگاه'],['faq','❓ سوالات']];
const R = {};

R.books = async () => {
  const bs = await api('/api/books');
  view.innerHTML = '<div class="grid">' + bs.map(b => `<div class="card" onclick="bookView(${b.id})">
    ${b.has_cover ? `<img class="cover" loading="lazy" src="${API_URL}/img/book/${b.id}">` : '<div class="cover"></div>'}
    <div class="t">${esc(b.title)}</div><div class="h">${esc(b.author)}${b.rating ? ' · ⭐ ' + b.rating : ''}</div></div>`).join('') + '</div>';
};
window.bookView = async id => {
  const b = await api('/api/books/' + id); let stars = 0;
  view.innerHTML = `<button class="btn alt" onclick="go('books')">→ بازگشت</button>
  <div class="card">${b.has_cover ? `<img class="cover" style="max-width:200px;display:block;margin:auto" src="${API_URL}/img/book/${b.id}">` : ''}
  <p class="t" style="font-size:17px;margin-top:8px">${esc(b.title)}</p><p class="h">${esc(b.author)}</p>
  <p style="white-space:pre-wrap;margin-top:8px">${esc(b.summary)}</p>
  ${b.physical_url ? `<button class="btn" onclick="openLink('${esc(b.physical_url)}')">🛒 خرید چاپی</button>` : ''}
  ${b.digital_url ? `<button class="btn alt" onclick="openLink('${esc(b.digital_url)}')">📱 نسخه دیجیتال</button>` : ''}</div>
  <div class="card"><p class="t">نظر شما</p><div class="stars" id="st"></div>
  <textarea id="rt" rows="3" placeholder="نظر شما (اختیاری)"></textarea>
  <button class="btn" id="rs">ثبت نظر</button></div>
  ${b.reviews.map(r => `<div class="card"><span class="t">${esc(r.name)}</span> <span style="color:#e3a008">${'★'.repeat(r.rating)}</span><p>${esc(r.text)}</p></div>`).join('')}`;
  const draw = () => $('#st').innerHTML = [1,2,3,4,5].map(i => `<span data-i="${i}">${i <= stars ? '★' : '☆'}</span>`).join('');
  draw(); $('#st').onclick = e => { if (e.target.dataset.i) { stars = +e.target.dataset.i; draw(); } };
  $('#rs').onclick = async () => { if (!stars) return toast('امتیاز را انتخاب کنید');
    try { const r = await api(`/api/books/${id}/review`, {rating: stars, text: $('#rt').value}); toast(r.first ? '🙏 ثبت شد، امتیاز باشگاه اضافه شد' : '🙏 نظر شما به‌روز شد'); bookView(id); } catch (e) { toast(e.message); } };
};

R.events = async () => {
  const es = await api('/api/events');
  view.innerHTML = es.map(e => `<div class="card"><p class="t">${esc(e.title)}</p>
    <p class="h">📆 ${e.date} ${esc(e.time_text)} · 📍 ${esc(e.place || '—')} · 👥 ${e.n}${e.capacity ? '/' + e.capacity : ''}</p>
    <p style="white-space:pre-wrap">${esc(e.description)}</p>
    ${e.expired ? '<p class="h">پایان یافته</p>' : `<button class="btn ${e.joined ? 'alt' : ''}" onclick="evToggle(${e.id})">${e.joined ? '✅ ثبت‌نام شده (لغو)' : 'ثبت‌نام'}</button>`}</div>`).join('') || '<p class="h">رویدادی نیست.</p>';
};
window.evToggle = async id => { try { const r = await api(`/api/events/${id}/toggle`, {}); toast(r.joined ? '✅ ثبت‌نام شد' : 'لغو شد'); R.events(); } catch (e) { toast(e.message); } };

R.contests = async () => {
  const cs = await api('/api/contests');
  view.innerHTML = cs.map(c => `<div class="card"><p class="t">${esc(c.title)}</p>
    <p class="h">${c.prize ? '🎁 ' + esc(c.prize) : ''} ${c.deadline ? '· ⏳ تا ' + c.deadline : ''}</p><p style="white-space:pre-wrap">${esc(c.description)}</p>
    ${c.expired ? '<p class="h">مهلت تمام شده</p>' : `<button class="btn" onclick="openBot('contest_${c.id}')">شرکت در مسابقه (در ربات)</button>`}</div>`).join('') || '<p class="h">مسابقه‌ی فعالی نیست.</p>';
};
R.news = async () => {
  const ns = await api('/api/news');
  view.innerHTML = ns.map(n => `<div class="card">${n.has_photo ? `<img class="news" loading="lazy" src="${API_URL}/img/news/${n.id}">` : ''}
    <p class="t">${esc(n.title)}</p><p class="h">${n.date}</p><p style="white-space:pre-wrap">${esc(n.body)}</p></div>`).join('') || '<p class="h">خبری نیست.</p>';
};
R.progress = async () => {
  const ps = await api('/api/progress'), bar = (l, v) => v == null ? '' : `<div class="h">${l}: ${v}٪</div><div class="bar"><i style="width:${v}%"></i></div>`;
  view.innerHTML = ps.map(p => `<div class="card"><p class="t">${esc(p.title)}</p><p class="h">${esc(p.author)}</p>
    ${bar('متن', p.text_pct)}${bar('صوتی', p.audio_pct)}${bar('پیشرفت کلی', p.overall_pct)}<p>${esc(p.note)}</p></div>`).join('') || '<p class="h">موردی نیست.</p>';
};
R.club = async () => {
  const c = await api('/api/club');
  view.innerHTML = `<div class="card" style="text-align:center"><p class="h">امتیاز شما</p><p class="t" style="font-size:32px">${c.points}</p>
    <p class="h">با ثبت نظر، شرکت در مسابقه و رویداد امتیاز بگیرید. دریافت کد تخفیف از داخل ربات.</p>
    <button class="btn" onclick="openBot('')">رفتن به ربات</button></div>
    <div class="card"><p class="t">🏅 برترین‌ها</p>${c.top.map((u, i) => `<p>${i + 1}. ${esc(u.name)} — ${u.points}</p>`).join('')}</div>`;
};
R.faq = async () => {
  const f = await api('/api/faq');
  view.innerHTML = f.map(q => `<div class="card"><details><summary>${esc(q.question)}</summary><p style="white-space:pre-wrap;margin-top:6px">${esc(q.answer)}</p></details></div>`).join('') || '<p class="h">—</p>';
};

// Wiki
R.wiki = async () => {
  const h = await api('/api/wiki');
  view.innerHTML = `<div class="card"><p class="h">رتبه شما: ${esc(h.rank)}</p>
    <p>📄 صفحات: ${h.total_pages} · 📝 مشارکت‌های شما: ${h.my_contributions} · ⏳ در انتظار: ${h.pending}</p>
    <button class="btn" onclick="wikiSearch()">🔍 جستجو</button>
    <button class="btn alt" onclick="wikiCreate()">📝 صفحه جدید</button>
    <button class="btn alt" onclick="wikiIncomplete()">📋 صفحات ناقص</button>
    <button class="btn alt" onclick="wikiLeaderboard()">🏆 رتبه‌بندی</button>
  </div>
  <div class="card"><p class="t">نوع صفحه را انتخاب کنید:</p>
    <button class="btn alt" onclick="wikiBrowse('book')">📚 کتاب</button>
    <button class="btn alt" onclick="wikiBrowse('character')">👤 شخصیت</button>
    <button class="btn alt" onclick="wikiBrowse('location')">📍 مکان</button>
    <button class="btn alt" onclick="wikiBrowse('event')">📅 رویداد</button>
    <button class="btn alt" onclick="wikiBrowse('group')">👥 گروه</button>
    <button class="btn alt" onclick="wikiBrowse('item')">🗡️ شیء</button>
    <button class="btn alt" onclick="wikiBrowse('technology')">⚙️ فناوری</button>
    <button class="btn alt" onclick="wikiBrowse('magic')">✨ جادو</button>
    <button class="btn alt" onclick="wikiBrowse('creature')">🐲 موجود</button>
    <button class="btn alt" onclick="wikiBrowse('concept')">💡 مفهوم</button>
    <button class="btn alt" onclick="wikiBrowse('relation')">🔗 رابطه</button>
    <button class="btn alt" onclick="wikiBrowse('secret')">🔒 راز</button>
  </div>`;
};

window.wikiSearch = async () => {
  const q = prompt('کلمه یا عبارت برای جستجو:');
  if (!q) return;
  try {
    const pages = await api('/api/wiki/search?q=' + encodeURIComponent(q));
    view.innerHTML = `<button class="btn alt" onclick="go('wiki')">→ بازگشت</button>` +
      (pages.length ? pages.map(p => `<div class="card" onclick="wikiPageView(${p.id})"><p class="t">${esc(p.title)}</p><p class="h">${esc(p.page_type)}</p></div>`).join('') : '<p class="h">نتیجه‌ای یافت نشد.</p>');
  } catch (e) { toast(e.message); }
};

window.wikiBrowse = async (type) => {
  try {
    const pages = await api('/api/wiki/pages?type=' + type);
    view.innerHTML = `<button class="btn alt" onclick="go('wiki')">→ بازگشت</button>` +
      (pages.length ? pages.map(p => `<div class="card" onclick="wikiPageView(${p.id})"><p class="t">${esc(p.title)}</p></div>`).join('') : '<p class="h">صفحه‌ای یافت نشد.</p>');
  } catch (e) { toast(e.message); }
};

window.wikiPageView = async (id) => {
  try {
    const page = await api('/api/wiki/pages/' + id);
    view.innerHTML = `<button class="btn alt" onclick="go('wiki')">→ بازگشت</button>
      <div class="card"><p class="t" style="font-size:17px">${esc(page.title)}</p>
      <p class="h">نوع: ${esc(page.page_type)} · اسپویلر: ${page.spoiler_level}</p>
      <p style="white-space:pre-wrap">${esc(page.content)}</p></div>`;
  } catch (e) { toast(e.message); }
};

window.wikiIncomplete = async () => {
  try {
    const pages = await api('/api/wiki/incomplete');
    view.innerHTML = `<button class="btn alt" onclick="go('wiki')">→ بازگشت</button>` +
      (pages.length ? pages.map(p => `<div class="card" onclick="wikiPageView(${p.id})"><p class="t">${esc(p.title)}</p><p class="h">${esc(p.page_type)}</p></div>`).join('') : '<p class="h">صفحه ناقصی یافت نشد.</p>');
  } catch (e) { toast(e.message); }
};

window.wikiLeaderboard = async () => {
  try {
    const users = await api('/api/wiki/leaderboard');
    view.innerHTML = `<button class="btn alt" onclick="go('wiki')">→ بازگشت</button>
      <div class="card"><p class="t">🏆 برترین‌ها</p>${users.map((u, i) => `<p>${i + 1}. ${esc(u.full_name || 'کاربر')} — ${u.wiki_points} امتیاز (${u.contributions_approved} مشارکت)</p>`).join('')}</div>`;
  } catch (e) { toast(e.message); }
};

window.wikiCreate = async () => {
  const types = await api('/api/wiki/types');
  const type = prompt('نوع صفحه را انتخاب کنید:\n' + Object.entries(types).map(([k, v]) => `${k}: ${v}`).join('\n'));
  if (!type || !types[type]) return;
  
  const title = prompt('عنوان صفحه:');
  if (!title) return;
  
  const content = prompt('محتوای صفحه:');
  if (!content) return;
  
  const spoiler = prompt('سطح اسپویلر (0=بدون, 1=کتاب اول, 2=تا جلد مشخص, 3=کل مجموعه):', '0');
  const spoiler_level = parseInt(spoiler) || 0;
  
  const officiality = prompt('سطح رسمیت (official=رسمی, verified=تأییدشده, fan=طرفداران, theory=نظریه, disputed=مورد اختلاف):', 'fan');
  
  const sources = prompt('منابع (اختیاری):', '');
  
  try {
    const r = await api('/api/wiki/pages', {page_type: type, title, content, spoiler_level, officiality, sources});
    toast('✅ پیشنهاد ثبت شد، منتظر تأیید ادمین بمانید');
    go('wiki');
  } catch (e) { toast(e.message); }
};

let cur;
window.go = async t => {
  cur = t; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  view.innerHTML = '<p class="h">در حال بارگذاری…</p>';
  try { await R[t](); } catch (e) { view.innerHTML = `<p class="h">${esc(e.message)}</p>`; }
};
(async () => {
  if (!INIT) { view.innerHTML = '<p class="h">این صفحه را از داخل تلگرام باز کنید.</p>'; return; }
  try {
    const h = await api('/api/home'); BOT = h.bot; $('#name').textContent = h.name; $('#sub').textContent = h.publisher + ' · ⭐ ' + h.points;
    const on = TABS.filter(([k]) => h.modules.includes(k));
    $('#nav').innerHTML = on.map(([k, l]) => `<button data-t="${k}" onclick="go('${k}')">${l}</button>`).join('');
    go(on[0] ? on[0][0] : 'books');
  } catch (e) { view.innerHTML = `<p class="h">${esc(e.message)}</p>`; }
})();
</script>
</body>
</html>
